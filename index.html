<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HolForm OS</title>
<meta name="theme-color" content="#0e1113">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand-row">
      <h1>Hol<span>Form</span> OS</h1>
      <div class="header-actions">
        <button id="season-toggle">
          <span class="dot"></span>
          <span id="season-label">Transition (No Driving)</span>
        </button>
      </div>
    </div>
    <div id="date-label"></div>
    <div class="tab-row">
      <button class="tab-btn active" data-tab="today">Today</button>
      <button class="tab-btn" data-tab="tasks">Tasks</button>
      <button class="tab-btn" data-tab="dashboard">Activation</button>
    </div>
  </header>
  <main>
    <div id="view-today"></div>
    <div id="view-tasks" class="hidden"></div>
    <div id="view-dashboard" class="hidden"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    window.location.reload();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
